<!doctype html>
<html lang="en" translate="no">

<title>The loneliest schoolboy: vocabulary trainer (B1)</title>
<style>
:root{
  --sea:#1D3B45; --sea-2:#2B5361; --mist:#E4ECEB; --paper:#FFFFFF; --ink:#1A2E35; --muted:#55686E;
  --line:#BBCACB; --primary:#1D3B45; --hivis:#DCEB3A; --reflect:#C3CBCD; --stamp:#E9F3B4;
  --ok:#22704B; --okbg:#E0F1E7; --bad:#AD3A28; --badbg:#F8E2DD;
  --display:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sea:#0E2229; --sea-2:#1F4250; --mist:#13252B; --paper:#1B323A; --ink:#E5EEEC; --muted:#A3B5B8;
    --line:#35505A; --primary:#2E6474; --hivis:#D4E43A; --reflect:#7D8C90; --stamp:#2E4A2E;
    --ok:#7FD3A4; --okbg:#173A2A; --bad:#F09A88; --badbg:#3E1F1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0E2229; --sea-2:#1F4250; --mist:#13252B; --paper:#1B323A; --ink:#E5EEEC; --muted:#A3B5B8;
  --line:#35505A; --primary:#2E6474; --hivis:#D4E43A; --reflect:#7D8C90; --stamp:#2E4A2E;
  --ok:#7FD3A4; --okbg:#173A2A; --bad:#F09A88; --badbg:#3E1F1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--mist);color:var(--ink);font:17px/1.5 var(--body);-webkit-text-size-adjust:100%}
button{font-family:inherit}

/* ---------- Header: a sea chart with one small island ---------- */
header{position:relative;overflow:hidden;background:var(--sea);color:#fff;padding:24px 16px 0}
.chart{position:absolute;right:-70px;top:-40px;width:330px;height:330px;pointer-events:none}
.chart path{fill:none;stroke:#9CC3C9}
.wrap{position:relative;max-width:528px;margin:0 auto}
.brand{margin:0 0 4px;font-size:15px;color:#B9D3D6}
h1{margin:0;font:600 clamp(36px,10.5vw,56px)/1 var(--display);letter-spacing:-.01em}
.sub{margin:12px 0 16px;color:#C9DCDE;font-size:15px;max-width:30ch}
nav.tabs{display:flex;gap:2px}
nav.tabs button{flex:1 1 0;min-width:0;background:transparent;border:0;color:#C9DCDE;font-weight:600;font-size:15px;
  padding:12px 4px 14px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--mist);color:var(--ink)}
nav.tabs button:focus-visible{outline:3px solid var(--hivis);outline-offset:-3px}

main{max-width:560px;margin:0 auto;padding:18px 16px 56px}
.meta{margin:10px 0 14px;color:var(--muted);font-size:15px}

/* Progress bar = a hi-vis band with a reflective strip */
.bar{height:12px;background:var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;transition:width .3s;
  background:linear-gradient(to bottom,var(--hivis) 0 34%,var(--reflect) 34% 66%,var(--hivis) 66%)}

/* Buttons */
.btn{min-height:48px;padding:12px 16px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);
  font-weight:600;font-size:16px;cursor:pointer}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.quiet{border-color:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}

/* ---------- Postcard ---------- */
.postcard{cursor:pointer;perspective:1400px}
.pc-inner{display:grid;position:relative;transition:transform .5s ease;transform-style:preserve-3d}
.postcard.flipped .pc-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border-radius:6px;
  padding:20px;min-height:320px;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(10,30,40,.55)}
.back{transform:rotateY(180deg)}
.postcard:not(.show-back) .back,.postcard.show-back .front{position:absolute;inset:0;overflow:hidden}
.back .hint-turn{margin-top:16px}
.front-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.where{margin:0;font-size:14px;color:var(--muted)}
.stamp{flex:none;padding:6px;background:radial-gradient(circle,var(--paper) 2.6px,transparent 3.1px) -1px -1px/9px 9px,var(--stamp);
  transform:rotate(3deg)}
.stamp-in{width:58px;height:66px;background:var(--stamp);border:1px solid rgba(29,59,69,.35);display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;padding:6px 0 4px;color:var(--sea)}
:root[data-theme="dark"] .stamp-in{color:var(--hivis)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp-in{color:var(--hivis)}}
.stamp-in svg{width:40px;height:30px;display:block}
.stamp-in span{font:600 12px/1 var(--body)}
.headword{display:flex;align-items:center;gap:6px;margin:auto 0 0;padding-top:28px}
.phrase{margin:0;font:600 clamp(34px,9.5vw,48px)/1.05 var(--display);overflow-wrap:anywhere}
.form{margin:10px 0 0;color:var(--muted);font-size:16px}
.writing-lines{margin:18px 0 0;border-top:1px solid var(--line)}
.hint-turn{margin:12px 0 0;color:var(--muted);font-size:14px}
.speaker{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--paper);color:var(--ink);
  display:inline-grid;place-items:center;cursor:pointer;padding:0}
.speaker svg{width:22px;height:22px}
.speaker:hover{border-color:var(--ink)}
.back-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 6px}
.back-title{margin:0;font:600 22px/1.15 var(--display)}
.meaning{margin:0 0 10px;font-size:19px;font-weight:600;line-height:1.4}
.back-btns{flex:none;display:flex;gap:8px}
.ru-btn{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--paper);color:var(--ink);
  font-size:14px;font-weight:700;cursor:pointer;padding:0}
.ru-btn:hover{border-color:var(--ink)}
.ru-btn[aria-pressed="true"]{background:var(--hivis);border-color:var(--hivis);color:#1A2E35}
.ru-text p{margin:0}
.ru-text p+p{margin-top:6px}
.ru-text{margin:8px 0 0;padding:10px 12px;border-left:4px solid var(--hivis);background:var(--mist);font-size:16px}
.lbl{display:block;font-size:13px;color:var(--muted);margin-top:14px}
.back p{margin:0}
.back ul{margin:2px 0 0;padding-left:18px}
.back li{margin-bottom:4px}
.back b,.hl{font-weight:700;background:linear-gradient(transparent 58%,var(--hivis) 58%);color:inherit}
:root[data-theme="dark"] .back b{background:linear-gradient(transparent 58%,rgba(212,228,58,.35) 58%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .back b{background:linear-gradient(transparent 58%,rgba(212,228,58,.35) 58%)}}

/* ---------- Match ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{min-height:44px;padding:8px 14px;border-radius:22px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  font-weight:600;font-size:16px;cursor:pointer}
.chip.sel{background:var(--hivis);border-color:var(--hivis);color:#1A2E35}
.chip.done{background:var(--okbg);border-color:var(--ok);color:var(--ok);cursor:default;text-decoration:line-through}
.defs{display:grid;gap:8px}
.def-btn{text-align:left;min-height:48px;padding:12px 14px;border-radius:12px;border:2px solid transparent;background:var(--paper);
  color:var(--ink);font-size:16px;cursor:pointer}
.def-btn.done{background:var(--okbg);border-color:var(--ok);cursor:default}
.def-btn.done b{display:block;color:var(--ok);margin-top:2px}
.def-btn.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- Choose & Write ---------- */
.q-card{background:var(--paper);border-radius:6px;padding:20px;box-shadow:0 1px 0 var(--line)}
.sentence{margin:0;font-size:20px;line-height:1.6}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);line-height:1.2}
.gap.filled{min-width:0;border-bottom-color:var(--ok);color:var(--ok);font-weight:700;padding:0 2px}
.cue{margin:10px 0 0;color:var(--muted);font-size:16px}
.options{display:grid;gap:8px;margin-top:14px}
@media (min-width:520px){.options{grid-template-columns:1fr 1fr}}
.opt{min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);
  font-size:17px;font-weight:600;cursor:pointer;text-align:left}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrongpick{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin:14px 0 0;padding:12px 14px;border-radius:12px;font-size:16px}
.fb p{margin:0}
.fb .fb-ru{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.fb.ok{background:var(--okbg)}
.fb.no{background:var(--badbg)}
.fb.note{background:var(--paper);color:var(--muted)}
.answer{width:100%;margin-top:14px;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);font-size:18px}
.answer.ok{border-color:var(--ok);background:var(--okbg)}
.answer.no{border-color:var(--bad);background:var(--badbg)}
.hint{margin:10px 0 0;font-size:18px;letter-spacing:.08em}

/* Summary */
.summary{background:var(--paper);border-radius:6px;padding:22px 20px;box-shadow:0 1px 0 var(--line);margin-top:14px}
.summary h2{margin:0 0 8px;font:600 30px/1.1 var(--display)}
.summary p{margin:0 0 10px}
.summary ul{margin:6px 0 0;padding-left:20px}
.summary li{margin-bottom:4px}

@media (prefers-reduced-motion:reduce){
  .pc-inner,.bar span{transition:none}
  .def-btn.wrong{animation:none}
}
</style>
</head>

const ALL = DATA.map((_, i) => i);

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = s => esc(s).replace(/\[\[(.+?)\]\]/g, "<b>$1</b>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bar = (done, total) => `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${total ? done / total * 100 : 0}%"></span></div>`;
const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?,]+$/, "").trim();
const gapHTML = (s, fill) => esc(s).replace("___", fill ? `<span class="gap filled">${esc(fill)}</span>` : `<span class="gap">&nbsp;</span>`);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const ruWord = d => d.ru.split(" — ")[0];

/* ---------- Voice (Web Speech API, British English if the device has it) ---------- */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en[-_]/i.test(v.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); }
function speak(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : "en-GB";
  if (voice) u.voice = voice;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const speakerBtn = (d) => canSpeak ? `<button class="speaker" type="button" data-say="${esc(d.say)}" aria-label="Listen: ${esc(d.en)}">${SPK}</button>` : "";
const ISLE = '<svg viewBox="0 0 40 30" aria-hidden="true"><path d="M2 24c4-2 8 2 12 0s8-2 12 0 8 2 12 0" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 21c1-5 5-8 9-8 5 0 8 3 9 8z" fill="currentColor"/><path d="M20 13V6l5 2-5 2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';

/* ---------- Tabs ---------- */
const tabs = [...document.querySelectorAll("nav.tabs button")];
const starters = {cards: () => startCards(), match: () => startMatch(), choose: () => startQuiz("choose"), write: () => startQuiz("write")};
tabs.forEach(b => b.addEventListener("click", () => {
  tabs.forEach(t => t.setAttribute("aria-selected", String(t === b)));
  if (canSpeak) speechSynthesis.cancel();
  starters[b.dataset.mode]();
}));

/* ---------- Cards ---------- */
let C;
function startCards(list = ALL, mix = false) {
  C = {base: list.slice(), queue: mix ? shuffle(list) : list.slice(), pos: 0, again: new Set()};
  renderCard();
}
function renderCard() {
  if (C.pos >= C.queue.length) return cardsDone();
  const d = DATA[C.queue[C.pos]];
  const num = DATA.indexOf(d) + 1;
  app.innerHTML = `${bar(C.pos, C.queue.length)}
  <p class="meta">Cards left: ${C.queue.length - C.pos}. Say the word, guess the meaning, then turn the card over.</p>
  <div class="postcard" id="pc">
    <div class="pc-inner">
      <div class="face front">
        <div class="front-top">
          <p class="where">${esc(d.src)}</p>
          <div class="stamp" aria-hidden="true"><div class="stamp-in">${ISLE}<span>${num}/${DATA.length}</span></div></div>
        </div>
        <div class="headword"><p class="phrase">${esc(d.en)}</p>${speakerBtn(d)}</div>
        <p class="form">${esc(d.form)}</p>
        <div class="writing-lines"></div>
        <p class="hint-turn">Tap the card to see the meaning.</p>
      </div>
      <div class="face back" aria-hidden="true">
        <div class="back-head"><p class="back-title">${esc(d.en)}</p><div class="back-btns">${speakerBtn(d)}<button class="ru-btn" type="button" aria-pressed="false" aria-controls="ruText" aria-label="Перевод на русский">RU</button></div></div>
        <p class="meaning">${esc(cap(d.meaning))}.</p>
        <div class="ru-text" id="ruText" lang="ru" hidden><p><strong>${esc(cap(d.ru))}.</strong></p><p>${esc(d.tipRu)}</p></div>
        <span class="lbl">How to use it</span>
        <p>${esc(d.use)}</p>
        <span class="lbl">Examples</span>
        <ul>${d.ex.map(e => `<li>${hl(e)}</li>`).join("")}</ul>
        <p class="hint-turn">Tap the card to turn it back.</p>
      </div>
    </div>
  </div>
  <div class="actions"><button class="btn" id="turn" type="button">Turn the card</button></div>
  <div class="actions">
    <button class="btn" id="again" type="button">Again</button>
    <button class="btn primary" id="know" type="button">I know it</button>
  </div>
  <div class="actions"><button class="btn quiet" id="mix" type="button">Shuffle the cards</button></div>`;
  const pc = document.getElementById("pc");
  const front = pc.querySelector(".front"), back = pc.querySelector(".back");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const flip = () => {
    const on = pc.classList.toggle("flipped");
    if (on) pc.classList.add("show-back");
    else setTimeout(() => { if (!pc.classList.contains("flipped")) pc.classList.remove("show-back"); }, reduce ? 0 : 500);
    front.setAttribute("aria-hidden", String(on));
    back.setAttribute("aria-hidden", String(!on));
    front.inert = on; back.inert = !on;
  };
  back.inert = true;
  pc.addEventListener("click", flip);
  pc.querySelectorAll(".speaker").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); speak(b.dataset.say); }));
  const ruBtn = pc.querySelector(".ru-btn"), ruText = pc.querySelector(".ru-text");
  ruBtn.addEventListener("click", e => {
    e.stopPropagation();

  document.getElementById("turn").onclick = flip;
  document.getElementById("again").onclick = () => { const i = C.queue[C.pos]; C.again.add(i); C.queue.push(i); C.pos++; renderCard(); };
  document.getElementById("know").onclick = () => { C.pos++; renderCard(); };

function cardsDone() {
  const hard = [...C.again];
  app.innerHTML = `${bar(1, 1)}
  <div class="summary">
    <h2>You've finished the cards</h2>
    ${hard.length
      ? `<p>You pressed Again for these words (${hard.length}):</p><ul>${hard.map(i => `<li><b>${esc(DATA[i].en)}</b>: ${esc(DATA[i].short)}</li>`).join("")}</ul>`
      : `<p>You knew every card. Now try Match, Choose and Write.</p>`}
  </div>
  <div class="actions">
    ${hard.length ? '<button class="btn primary" id="hard" type="button">Practise these again</button>' : ""}
    <button class="btn" id="restart" type="button">Start again</button>
  </div>`;
  if (hard.length) document.getElementById("hard").onclick = () => startCards(hard, true);
  document.getElementById("restart").onclick = () => startCards();

/* ---------- Match ---------- */
let M;
function startMatch(list = ALL) {
  const s = shuffle(list), rounds = [];
  for (let i = 0; i < s.length; i += 6) rounds.push(s.slice(i, i + 6));
  if (rounds.length > 1 && rounds[rounds.length - 1].length < 3) rounds[rounds.length - 2].push(...rounds.pop());
  M = {rounds, r: 0, sel: null, done: new Set(), mistakes: 0, wrong: new Set()};
  renderMatch();
}
function renderMatch() {
  if (M.r >= M.rounds.length) return matchDone();
  const ids = M.rounds[M.r], defs = shuffle(ids);
  app.innerHTML = `${bar(M.r, M.rounds.length)}
  <p class="meta" id="mmeta">Round ${M.r + 1} of ${M.rounds.length}. Choose a word, then choose its meaning.</p>
  <div class="chips">${ids.map(i => `<button class="chip" type="button" data-i="${i}">${esc(DATA[i].en)}</button>`).join("")}</div>
  <div class="defs">${defs.map(i => `<button class="def-btn" type="button" data-i="${i}">${esc(DATA[i].short)}</button>`).join("")}</div>`;
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    if (b.disabled) return;
    M.sel = +b.dataset.i;
    app.querySelectorAll(".chip").forEach(c => c.classList.toggle("sel", c === b));
  });
  app.querySelectorAll(".def-btn").forEach(b => b.onclick = () => {
    if (b.disabled) return;
    const meta = document.getElementById("mmeta");
    if (M.sel === null) { meta.textContent = "Choose a word first, then its meaning. Сначала выбери слово, потом значение."; return; }
    const i = +b.dataset.i;
    if (i === M.sel) {
      const chip = app.querySelector(`.chip[data-i="${i}"]`);
      chip.classList.remove("sel"); chip.classList.add("done"); chip.disabled = true;
      b.classList.remove("wrong"); b.classList.add("done"); b.disabled = true;
      b.insertAdjacentHTML("beforeend", `<b>${esc(DATA[i].en)} — <span lang="ru">${esc(ruWord(DATA[i]))}</span></b>`);
      speak(DATA[i].say);
      M.done.add(i); M.sel = null;
      meta.textContent = `Round ${M.r + 1} of ${M.rounds.length}. Correct! Верно: ${DATA[i].en} — ${ruWord(DATA[i])}.`;
      if (ids.every(x => M.done.has(x))) setTimeout(() => { M.r++; renderMatch(); }, 800);
    } else {
      M.mistakes++; M.wrong.add(M.sel);
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      setTimeout(() => b.classList.remove("wrong"), 600);
      meta.textContent = `Not this one. Try another meaning for “${DATA[M.sel].en}”. Не подходит — это значение другого слова, ищи значение для «${DATA[M.sel].en}».`;
    }
  });
}
function matchDone() {
  const w = [...M.wrong];
  app.innerHTML = `${bar(1, 1)}
  <div class="summary">
    <h2>All pairs matched</h2>
    <p>Mistakes: ${M.mistakes}.</p>
    ${w.length ? `<p>You made mistakes with these words:</p><ul>${w.map(i => `<li><b>${esc(DATA[i].en)}</b>: ${esc(DATA[i].short)}</li>`).join("")}</ul>` : "<p>No mistakes. Great job!</p>"}
  </div>
  <div class="actions">
    ${w.length >= 3 ? '<button class="btn primary" id="rep" type="button">Practise these again</button>' : ""}
    <button class="btn" id="restart" type="button">Start again</button>
  </div>`;
  if (w.length >= 3) document.getElementById("rep").onclick = () => startMatch(w);
  document.getElementById("restart").onclick = () => startMatch();
}

/* ---------- Choose & Write ---------- */
let QZ;
function startQuiz(kind, list = ALL) {
  QZ = {kind, order: shuffle(list), pos: 0, score: 0, wrong: [], answered: false};
  kind === "choose" ? renderChoose() : renderWrite();
}
const head = () => `${bar(QZ.pos, QZ.order.length)}<p class="meta">Question ${QZ.pos + 1} of ${QZ.order.length}. Correct: ${QZ.score}</p>`;
function nextBtn() {
  const n = document.getElementById("next");
  n.hidden = false; n.focus({preventScroll: true});
  n.onclick = () => { QZ.pos++; QZ.kind === "choose" ? renderChoose() : renderWrite(); };
}
function feedback(ok, answer, d) {
  return ok
    ? `<div class="fb ok"><p><b>Correct!</b> ${esc(cap(d.tip))}</p><p class="fb-ru" lang="ru"><b>Верно.</b> ${esc(cap(d.tipRu))}</p></div>`
    : `<div class="fb no"><p><b>Not quite.</b> The answer is <b>${esc(answer)}</b>. ${esc(cap(d.tip))}</p><p class="fb-ru" lang="ru"><b>Неверно.</b> Правильный ответ: <b>${esc(answer)}</b>. ${esc(cap(d.tipRu))}</p></div>`;
}
function renderChoose() {
  if (QZ.pos >= QZ.order.length) return quizDone();
  const i = QZ.order[QZ.pos], d = DATA[i], [s, a, dist] = d.mc;
  const opts = shuffle([a, ...dist]);
  QZ.answered = false;
  app.innerHTML = `${head()}
  <div class="q-card"><p class="sentence" id="sent">${gapHTML(s)}</p></div>
  <div class="options">${opts.map(o => `<button class="opt" type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
  <div id="fb"></div>
  <div class="actions"><button class="btn primary" id="next" type="button" hidden>Next</button></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (QZ.answered) return;
    QZ.answered = true;
    const ok = b.dataset.o === a;
    app.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.dataset.o === a) x.classList.add("right"); });
    if (!ok) b.classList.add("wrongpick");
    document.getElementById("sent").innerHTML = gapHTML(s, a);
    if (ok) QZ.score++; else QZ.wrong.push(i);
    document.getElementById("fb").innerHTML = feedback(ok, a, d);
    nextBtn();
  });
}
function renderWrite() {

  QZ.answered = false;
  const shown = s.startsWith("___") ? cap(acc[0]) : acc[0];
  const pattern = shown.split(" ").map(w => w[0] + w.slice(1).replace(/[a-z]/gi, "_")).join(" ");
  app.innerHTML = `${head()}
  <div class="q-card">
    <p class="sentence" id="sent">${gapHTML(s)}</p>
    <p class="cue">Meaning: ${esc(cue || d.short)}</p>
    <p class="hint" id="hint" hidden>${esc(pattern)}</p>
  </div>
  <input class="answer" id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the missing words">
  <div id="fb"></div>
  <div class="actions">
    <button class="btn" id="hintBtn" type="button">Show first letters</button>
    <button class="btn primary" id="check" type="button">Check</button>
  </div>
  <div class="actions"><button class="btn primary" id="next" type="button" hidden>Next</button></div>`;
  const inp = document.getElementById("ans");
  inp.focus({preventScroll: true});
  document.getElementById("hintBtn").onclick = () => { document.getElementById("hint").hidden = false; inp.focus(); };
  const check = () => {
    if (QZ.answered) return;
    if (!inp.value.trim()) { document.getElementById("fb").innerHTML = '<p class="fb note">Type your answer first.</p>'; inp.focus(); return; }
    QZ.answered = true;
    const ok = acc.map(norm).includes(norm(inp.value));
    inp.readOnly = true; inp.classList.add(ok ? "ok" : "no");
    document.getElementById("check").disabled = true;
    document.getElementById("hintBtn").disabled = true;
    document.getElementById("sent").innerHTML = gapHTML(s, shown);
    if (ok) QZ.score++; else QZ.wrong.push(i);
    document.getElementById("fb").innerHTML = feedback(ok, shown, d);
    nextBtn();
  };
  document.getElementById("check").onclick = check;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (!QZ.answered) check(); else document.getElementById("next").click(); } });
}
function quizDone() {
  const w = [...new Set(QZ.wrong)], kind = QZ.kind;
  app.innerHTML = `${bar(1, 1)}
  <div class="summary">
    <h2>Your score: ${QZ.score} out of ${QZ.order.length}</h2>
    ${w.length ? `<p>You made mistakes here:</p><ul>${w.map(i => `<li><b>${esc(DATA[i].en)}</b>: ${esc(DATA[i].short)}</li>`).join("")}</ul>` : "<p>Everything is correct. Great work!</p>"}
  </div>
  <div class="actions">
    ${w.length ? '<button class="btn primary" id="rep" type="button">Practise your mistakes</button>' : ""}
    <button class="btn" id="restart" type="button">Start again</button>
  </div>`;
  if (w.length) document.getElementById("rep").onclick = () => startQuiz(kind, w);
  document.getElementById("restart").onclick = () => startQuiz(kind);
}

startCards();
</script>
</body>
